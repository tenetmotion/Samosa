name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile backend
        shell: powershell
        run: Get-ChildItem backend/*.py | ForEach-Object { python -m py_compile $_.FullName }
      - name: Install media fixture dependencies
        run: python -m pip install av==15.1.0 opencv-python-headless==4.13.0.92 numpy==2.4.4
      - name: Run source contracts
        run: python -m unittest discover -s tests -v
      - name: Run panel runtime tests
        shell: powershell
        run: |
          Get-ChildItem tests/test_*_runtime.js | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Validate release archive
        shell: powershell
        run: .\scripts\package-release.ps1 -Version 0.0.0-ci
